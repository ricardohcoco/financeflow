services:
  database:
    image: postgres:18
    container_name: financeflow-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - financeflow_data:/var/lib/postgresql

volumes:
  financeflow_data: